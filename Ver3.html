<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>四季の恵みスイカゲーム</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js Physics Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 100%);
        }
        .wood-border {
            border: 12px solid #8B4513;
            border-radius: 16px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 10px 25px rgba(0,0,0,0.2);
            background: rgba(255, 255, 255, 0.85);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-2 sm:p-4 font-sans text-gray-800">

    <!-- Header / Scoreboard -->
    <header class="w-full max-w-md flex justify-between items-center bg-white/80 backdrop-blur border border-emerald-100 p-3 rounded-2xl shadow-sm mb-2">
        <div class="flex items-center space-x-2">
            <span id="seasonBadge" class="px-3 py-1 bg-emerald-500 text-white font-bold rounded-full text-xs sm:text-sm shadow-sm">
                🌸 春
            </span>
            <button id="btnOpenSettings" class="p-2 text-gray-600 hover:text-emerald-600 transition rounded-lg hover:bg-gray-100" title="設定・カスタム">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <button id="btnToggleSound" class="p-2 text-gray-600 hover:text-emerald-600 transition rounded-lg hover:bg-gray-100" title="効果音切替">
                <i id="soundIcon" class="fa-solid fa-volume-high text-lg"></i>
            </button>
        </div>

        <div class="flex space-x-3 text-right">
            <div>
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">スコア</div>
                <div id="scoreDisplay" class="text-lg sm:text-xl font-black text-emerald-600 leading-none">0</div>
            </div>
            <div class="border-l border-gray-200 pl-3">
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">ベスト</div>
                <div id="highScoreDisplay" class="text-lg sm:text-xl font-black text-amber-500 leading-none">0</div>
            </div>
            <div class="border-l border-gray-200 pl-3">
                <div class="text-[10px] text-gray-400 font-bold uppercase tracking-wider">タイム</div>
                <div id="timeDisplay" class="text-lg sm:text-xl font-bold text-gray-700 leading-none">00:00</div>
            </div>
        </div>
    </header>

    <!-- Main Game Container -->
    <main class="w-full max-w-md flex flex-col items-center relative">

        <!-- Top Preview Bar (CURRENT & NEXT) -->
        <div class="w-full flex justify-between items-center px-4 py-2 bg-white/60 backdrop-blur rounded-t-2xl border-t border-x border-emerald-100/50 shadow-sm">
            <!-- CURRENT -->
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-gray-500">落とす:</span>
                <div id="currentBadge" class="w-10 h-10 rounded-full flex items-center justify-center font-bold text-white text-xl shadow-md transition-transform duration-200">
                    -
                </div>
            </div>
            <!-- NEXT -->
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-gray-500">次:</span>
                <div id="nextBadge" class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-white text-base shadow-md opacity-80">
                    -
                </div>
            </div>
        </div>

        <!-- Box Frame & Canvas Area -->
        <div id="gameBox" class="relative w-full aspect-[3/4] wood-border overflow-hidden cursor-crosshair">
            <!-- Canvas -->
            <canvas id="gameCanvas" class="w-full h-full block"></canvas>

            <!-- Guide Line -->
            <div id="guideLine" class="absolute top-0 w-0.5 h-full bg-emerald-400/50 border-r border-dashed border-emerald-500 pointer-events-none hidden"></div>

            <!-- Start Overlay -->
            <div id="startOverlay" class="absolute inset-0 bg-white/90 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-10">
                <div class="w-16 h-16 bg-emerald-100 rounded-full flex items-center justify-center mb-4 text-emerald-600 text-2xl shadow-inner">
                    <i class="fa-solid fa-leaf"></i>
                </div>
                <h1 class="text-2xl font-black text-gray-800 mb-2">四季の恵みスイカゲーム</h1>
                <p class="text-xs text-gray-500 mb-6 max-w-xs leading-relaxed">
                    同じ季節の食べ物をぶつけて大きく進化させよう！<br>設定から春夏秋冬の食べ物・絵文字をカスタマイズ可能。
                </p>
                <button id="btnStartGame" class="w-full max-w-xs py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg hover:shadow-emerald-200 transition-all active:scale-95 text-base">
                    ゲームスタート
                </button>
            </div>

            <!-- Game Over Overlay -->
            <div id="gameOverOverlay" class="absolute inset-0 bg-gray-900/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center z-20 hidden">
                <div class="w-16 h-16 bg-red-100 text-red-500 rounded-full flex items-center justify-center mb-3 text-2xl shadow-inner">
                    <i class="fa-solid fa-heart-crack"></i>
                </div>
                <h2 class="text-2xl font-black text-white mb-1">ゲームオーバー</h2>
                <p class="text-xs text-gray-300 mb-4">箱から食べ物があふれてしまいました！</p>
                
                <div class="bg-white/10 rounded-xl p-3 w-full max-w-xs mb-6 text-white text-left space-y-1 text-sm border border-white/10">
                    <div class="flex justify-between"><span>最終スコア:</span><span id="finalScore" class="font-bold text-emerald-400">0</span></div>
                    <div class="flex justify-between"><span>プレイ時間:</span><span id="finalTime" class="font-bold text-gray-200">00:00</span></div>
                </div>

                <button id="btnRestartGame" class="w-full max-w-xs py-3.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl shadow-lg transition-all active:scale-95 text-base">
                    もう一度プレイ
                </button>
            </div>
        </div>

        <!-- Controls / Actions -->
        <div class="w-full flex justify-between items-center mt-3">
            <button id="btnResetInGame" class="px-4 py-2 bg-white hover:bg-gray-50 text-gray-600 font-bold text-xs rounded-xl shadow-sm border border-gray-200 transition active:scale-95">
                <i class="fa-solid fa-rotate-right mr-1"></i> リセット
            </button>
            <div class="text-[11px] text-gray-400 font-medium">
                タップ / クリックで落とす
            </div>
        </div>
    </main>

    <!-- Settings / Customization Modal -->
    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="bg-white rounded-2xl w-full max-w-md max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <!-- Modal Header -->
            <div class="p-4 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <h3 class="font-bold text-gray-800 text-base flex items-center">
                    <i class="fa-solid fa-sliders text-emerald-500 mr-2"></i> 季節・食べ物カスタム
                </h3>
                <button id="btnCloseSettings" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>

            <!-- Modal Body -->
            <div class="p-4 overflow-y-auto flex-1 space-y-4">
                <!-- Season Tabs -->
                <div>
                    <label class="block text-xs font-bold text-gray-500 mb-2">季節の選択</label>
                    <div class="grid grid-cols-4 gap-2" id="seasonTabContainer">
                        <button data-season="spring" class="season-tab active p-2 rounded-xl text-xs font-bold border transition text-center bg-emerald-500 text-white border-emerald-500">
                            🌸 春
                        </button>
                        <button data-season="summer" class="season-tab p-2 rounded-xl text-xs font-bold border transition text-center bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200">
                            🌻 夏
                        </button>
                        <button data-season="autumn" class="season-tab p-2 rounded-xl text-xs font-bold border transition text-center bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200">
                            🍁 秋
                        </button>
                        <button data-season="winter" class="season-tab p-2 rounded-xl text-xs font-bold border transition text-center bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200">
                            ❄️ 冬
                        </button>
                    </div>
                </div>

                <!-- Evolution List (Names & Emoji) -->
                <div>
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-xs font-bold text-gray-500">進化順のカスタマイズ (Lv.1〜Lv.11)</label>
                        <button id="btnResetSeasonDefault" class="text-[11px] text-emerald-600 font-bold hover:underline">
                            デフォルトに戻す
                        </button>
                    </div>
                    <div id="customFoodList" class="space-y-2">
                        <!-- Dynamic Lv.1 - Lv.11 Inputs generated by JS -->
                    </div>
                </div>
            </div>

            <!-- Modal Footer -->
            <div class="p-4 border-t border-gray-100 bg-gray-50/50 flex space-x-2">
                <button id="btnSaveSettings" class="flex-1 py-3 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-sm rounded-xl shadow transition active:scale-95">
                    設定を保存して適用
                </button>
            </div>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        // --- Default Season Datasets with Emojis ---
        const DEFAULT_DATASETS = {
            spring: [
                { name: "さくらんぼ", emoji: "🍒", color: "#FF4D6D" },
                { name: "いちご", emoji: "🍓", color: "#FF2A55" },
                { name: "うめ", emoji: "🟢", color: "#4CAF50" },
                { name: "デコポン", emoji: "🍊", color: "#FF9800" },
                { name: "キウイ", emoji: "🥝", color: "#8BC34A" },
                { name: "トマト", emoji: "🍅", color: "#F44336" },
                { name: "はっさく", emoji: "🍊", color: "#FFB300" },
                { name: "もも", emoji: "🍑", color: "#FF80AB" },
                { name: "メロン", emoji: "🍈", color: "#AEEA00" },
                { name: "たけのこ", emoji: "🎋", color: "#8D6E63" },
                { name: "キャベツ", emoji: "🥬", color: "#66BB6A" }
            ],
            summer: [
                { name: "ヤマモモ", emoji: "🫐", color: "#E91E63" },
                { name: "すもも", emoji: "🍑", color: "#F44336" },
                { name: "フサスグリ", emoji: "🍒", color: "#D32F2F" },
                { name: "パッションフルーツ", emoji: "🟣", color: "#9C27B0" },
                { name: "マンゴー", emoji: "🥭", color: "#FF9800" },
                { name: "ぶどう", emoji: "🍇", color: "#673AB7" },
                { name: "パイナップル", emoji: "🍍", color: "#FBC02D" },
                { name: "もも", emoji: "🍑", color: "#FF80AB" },
                { name: "メロン", emoji: "🍈", color: "#AEEA00" },
                { name: "すいか", emoji: "🍉", color: "#2E7D32" },
                { name: "カボチャ", emoji: "🎃", color: "#FB8C00" }
            ],
            autumn: [
                { name: "どんぐり", emoji: "🌰", color: "#795548" },
                { name: "あけび", emoji: "🍆", color: "#8E24AA" },
                { name: "イチジク", emoji: "🫐", color: "#AD1457" },
                { name: "すだち", emoji: "🟢", color: "#4CAF50" },
                { name: "かき", emoji: "🍊", color: "#FF6F00" },
                { name: "なし", emoji: "🍐", color: "#D4E157" },
                { name: "りんご", emoji: "🍎", color: "#E53935" },
                { name: "くり", emoji: "🌰", color: "#6D4C41" },
                { name: "まつたけ", emoji: "🍄", color: "#8D6E63" },
                { name: "さつまいも", emoji: "🍠", color: "#8E24AA" },
                { name: "かぼちゃ", emoji: "🎃", color: "#F57C00" }
            ],
            winter: [
                { name: "ナンテン", emoji: "🔴", color: "#D32F2F" },
                { name: "きんかん", emoji: "🟠", color: "#FFB300" },
                { name: "ゆず", emoji: "🍋", color: "#FBC02D" },
                { name: "ポンカン", emoji: "🍊", color: "#FB8C00" },
                { name: "みかん", emoji: "🍊", color: "#FF9800" },
                { name: "キウイ", emoji: "🥝", color: "#8BC34A" },
                { name: "いよかん", emoji: "🍊", color: "#F57C00" },
                { name: "りんご", emoji: "🍎", color: "#E53935" },
                { name: "れんこん", emoji: "🟤", color: "#D7CCC8" },
                { name: "だいこん", emoji: "🥬", color: "#ECEFF1" },
                { name: "はくさい", emoji: "🥬", color: "#A5D6A7" }
            ]
        };

        const BASE_RADII = [16, 22, 28, 34, 42, 50, 60, 70, 82, 95, 110];

        const SEASON_META = {
            spring: { badge: "🌸 春", color: "bg-emerald-500", border: "border-emerald-500" },
            summer: { badge: "🌻 夏", color: "bg-amber-500", border: "border-amber-500" },
            autumn: { badge: "🍁 秋", color: "bg-orange-500", border: "border-orange-500" },
            winter: { badge: "❄️ 冬", color: "bg-sky-500", border: "border-sky-500" }
        };

        let currentSeason = 'spring';
        let seasonDatasets = JSON.parse(JSON.stringify(DEFAULT_DATASETS));
        
        let score = 0;
        let highScore = 0;
        let soundEnabled = true;
        let gameTimer = null;
        let elapsedTime = 0;
        let isGameOver = false;
        let isGameStarted = false;

        let currentFoodIndex = 0;
        let nextFoodIndex = 0;
        let canDrop = true;

        const { Engine, Bodies, Composite, Events } = Matter;
        let engine, runner;
        let canvas, ctx;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (!soundEnabled || audioCtx.state === 'suspended') return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'drop') {
                    osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.1);
                } else if (type === 'merge') {
                    osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'gameover') {
                    osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            loadSavedCustomizations();
            initGameEngine();
            bindEvents();
            updateUIHeader();
        });

        function loadSavedCustomizations() {
            const savedData = localStorage.getItem('seasons_custom_data');
            if (savedData) {
                try {
                    seasonDatasets = JSON.parse(savedData);
                } catch(e) {}
            }
            const savedHighScore = localStorage.getItem('suika_high_score');
            if (savedHighScore) {
                highScore = parseInt(savedHighScore, 10) || 0;
                document.getElementById('highScoreDisplay').textContent = highScore;
            }
        }

        function saveCustomizations() {
            localStorage.setItem('seasons_custom_data', JSON.stringify(seasonDatasets));
        }

        function initGameEngine() {
            const box = document.getElementById('gameBox');
            canvas = document.getElementById('gameCanvas');
            
            const width = box.clientWidth;
            const height = box.clientHeight;
            
            canvas.width = width;
            canvas.height = height;

            engine = Engine.create({
                gravity: { x: 0, y: 1.2, scale: 0.001 }
            });

            const wallThickness = 60;
            const ground = Bodies.rectangle(width / 2, height + wallThickness / 2 - 5, width, wallThickness, { isStatic: true, friction: 0.5 });
            const leftWall = Bodies.rectangle(-wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.5 });
            const rightWall = Bodies.rectangle(width + wallThickness / 2, height / 2, wallThickness, height * 2, { isStatic: true, friction: 0.5 });

            Composite.add(engine.world, [ground, leftWall, rightWall]);

            ctx = canvas.getContext('2d');
            Events.on(engine, 'collisionStart', handleCollisions);

            runner = Matter.Runner.create();
            Matter.Runner.run(runner, engine);

            requestAnimationFrame(renderLoop);
        }

        function renderLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const bodies = Composite.allBodies(engine.world);
            const dataset = seasonDatasets[currentSeason];

            bodies.forEach(body => {
                if (body.isStatic || !body.customData) return;

                const { position, circleRadius, customData } = body;
                const foodInfo = dataset[customData.level];

                if (!foodInfo) return;

                ctx.save();
                ctx.translate(position.x, position.y);
                ctx.rotate(body.angle);

                // Circle Body
                ctx.beginPath();
                ctx.arc(0, 0, circleRadius, 0, Math.PI * 2);
                ctx.fillStyle = foodInfo.color;
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();

                // Emoji Rendering
                ctx.fillStyle = '#ffffff';
                ctx.font = `${Math.max(12, circleRadius * 0.9)}px sans-serif`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(foodInfo.emoji || '🍒', 0, 0);

                ctx.restore();

                // Game Over Check Line
                if (isGameStarted && !isGameOver && position.y - circleRadius < 50 && body.velocity.y > -0.1) {
                    if (!body.dangerTimer) {
                        body.dangerTimer = Date.now();
                    } else if (Date.now() - body.dangerTimer > 2000) {
                        triggerGameOver();
                    }
                } else {
                    body.dangerTimer = null;
                }
            });

            requestAnimationFrame(renderLoop);
        }

        function handleCollisions(event) {
            if (isGameOver) return;
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;
                if (bodyA.customData && bodyB.customData) {
                    if (bodyA.customData.level === bodyB.customData.level && !bodyA.customData.merged && !bodyB.customData.merged) {
                        const currentLevel = bodyA.customData.level;
                        if (currentLevel < 10) {
                            bodyA.customData.merged = true;
                            bodyB.customData.merged = true;

                            const midX = (bodyA.position.x + bodyB.position.x) / 2;
                            const midY = (bodyA.position.y + bodyB.position.y) / 2;

                            Composite.remove(engine.world, [bodyA, bodyB]);

                            const nextLevel = currentLevel + 1;
                            spawnFoodAt(midX, midY, nextLevel, false);

                            const points = (nextLevel + 1) * 10;
                            addScore(points);
                            playSound('merge');
                        }
                    }
                }
            });
        }

        function spawnFoodAt(x, y, level, isDrop = true) {
            const radius = BASE_RADII[level];
            const food = Bodies.circle(x, y, radius, {
                restitution: 0.2,
                friction: 0.1,
                density: 0.001
            });

            food.customData = { level, merged: false };
            Composite.add(engine.world, food);

            if (isDrop) {
                playSound('drop');
            }
        }

        function rollNextFoods() {
            currentFoodIndex = nextFoodIndex;
            nextFoodIndex = Math.floor(Math.random() * 3);
            updatePreviewBadges();
        }

        function updatePreviewBadges() {
            const dataset = seasonDatasets[currentSeason];
            const currentItem = dataset[currentFoodIndex];
            const nextItem = dataset[nextFoodIndex];

            const currentBadge = document.getElementById('currentBadge');
            const nextBadge = document.getElementById('nextBadge');

            currentBadge.style.backgroundColor = currentItem.color;
            currentBadge.textContent = currentItem.emoji;

            nextBadge.style.backgroundColor = nextItem.color;
            nextBadge.textContent = nextItem.emoji;
        }

        function addScore(pts) {
            score += pts;
            document.getElementById('scoreDisplay').textContent = score;

            if (score > highScore) {
                highScore = score;
                document.getElementById('highScoreDisplay').textContent = highScore;
                localStorage.setItem('suika_high_score', highScore);
            }
        }

        function startGame() {
            score = 0;
            elapsedTime = 0;
            isGameOver = false;
            isGameStarted = true;
            canDrop = true;

            document.getElementById('scoreDisplay').textContent = 0;
            document.getElementById('timeDisplay').textContent = "00:00";
            document.getElementById('startOverlay').classList.add('hidden');
            document.getElementById('gameOverOverlay').classList.add('hidden');

            const bodies = Composite.allBodies(engine.world);
            bodies.forEach(b => {
                if (!b.isStatic) Composite.remove(engine.world, b);
            });

            nextFoodIndex = Math.floor(Math.random() * 3);
            rollNextFoods();

            if (gameTimer) clearInterval(gameTimer);
            gameTimer = setInterval(() => {
                elapsedTime++;
                const mins = String(Math.floor(elapsedTime / 60)).padStart(2, '0');
                const secs = String(elapsedTime % 60).padStart(2, '0');
                document.getElementById('timeDisplay').textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function triggerGameOver() {
            isGameOver = true;
            isGameStarted = false;
            clearInterval(gameTimer);

            playSound('gameover');

            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalTime').textContent = document.getElementById('timeDisplay').textContent;
            document.getElementById('gameOverOverlay').classList.remove('hidden');

            if (score >= highScore && score > 0) {
                confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
            }
        }

        function updateUIHeader() {
            const meta = SEASON_META[currentSeason];
            const badge = document.getElementById('seasonBadge');
            badge.textContent = meta.badge;
            badge.className = `px-3 py-1 text-white font-bold rounded-full text-xs sm:text-sm shadow-sm ${meta.color}`;
        }

        function bindEvents() {
            document.body.addEventListener('click', () => {
                if (audioCtx.state === 'suspended') audioCtx.resume();
            }, { once: true });

            document.getElementById('btnStartGame').addEventListener('click', startGame);
            document.getElementById('btnRestartGame').addEventListener('click', startGame);
            document.getElementById('btnResetInGame').addEventListener('click', () => {
                if (confirm('ゲームをリセットしますか？')) {
                    startGame();
                }
            });

            document.getElementById('btnToggleSound').addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                document.getElementById('soundIcon').className = soundEnabled ? "fa-solid fa-volume-high text-lg" : "fa-solid fa-volume-xmark text-lg text-red-400";
            });

            const settingsModal = document.getElementById('settingsModal');
            document.getElementById('btnOpenSettings').addEventListener('click', () => {
                renderCustomFoodInputs(currentSeason);
                settingsModal.classList.remove('hidden');
            });
            document.getElementById('btnCloseSettings').addEventListener('click', () => {
                settingsModal.classList.add('hidden');
            });

            document.querySelectorAll('.season-tab').forEach(tab => {
                tab.addEventListener('click', (e) => {
                    const targetSeason = e.currentTarget.getAttribute('data-season');
                    document.querySelectorAll('.season-tab').forEach(t => {
                        t.className = "season-tab p-2 rounded-xl text-xs font-bold border transition text-center bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200";
                    });
                    const meta = SEASON_META[targetSeason];
                    e.currentTarget.className = `season-tab active p-2 rounded-xl text-xs font-bold border transition text-center ${meta.color} text-white ${meta.border}`;

                    renderCustomFoodInputs(targetSeason);
                });
            });

            document.getElementById('btnSaveSettings').addEventListener('click', () => {
                const activeTab = document.querySelector('.season-tab.active');
                const selectedSeason = activeTab ? activeTab.getAttribute('data-season') : 'spring';

                const dataset = seasonDatasets[selectedSeason];
                const rows = document.querySelectorAll('.food-input-row');
                
                rows.forEach((row, idx) => {
                    const nameInput = row.querySelector('.food-name-input');
                    const emojiInput = row.querySelector('.food-emoji-input');

                    if (nameInput && nameInput.value.trim() !== '') {
                        dataset[idx].name = nameInput.value.trim();
                    }
                    if (emojiInput && emojiInput.value.trim() !== '') {
                        dataset[idx].emoji = emojiInput.value.trim();
                    }
                });

                currentSeason = selectedSeason;
                saveCustomizations();
                updateUIHeader();
                updatePreviewBadges();

                settingsModal.classList.add('hidden');
            });

            document.getElementById('btnResetSeasonDefault').addEventListener('click', () => {
                const activeTab = document.querySelector('.season-tab.active');
                const selectedSeason = activeTab ? activeTab.getAttribute('data-season') : 'spring';

                if (confirm(`${SEASON_META[selectedSeason].badge} の設定をデフォルトに戻しますか？`)) {
                    seasonDatasets[selectedSeason] = JSON.parse(JSON.stringify(DEFAULT_DATASETS[selectedSeason]));
                    renderCustomFoodInputs(selectedSeason);
                }
            });

            const box = document.getElementById('gameBox');
            const guideLine = document.getElementById('guideLine');

            const handleMove = (e) => {
                if (!isGameStarted || isGameOver) return;
                const rect = box.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                let x = clientX - rect.left;

                const radius = BASE_RADII[currentFoodIndex];
                x = Math.max(radius, Math.min(box.clientWidth - radius, x));

                guideLine.style.left = `${x}px`;
                guideLine.classList.remove('hidden');
            };

            const handleDrop = (e) => {
                if (!isGameStarted || isGameOver || !canDrop) return;
                const rect = box.getBoundingClientRect();
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                let x = clientX - rect.left;

                const radius = BASE_RADII[currentFoodIndex];
                x = Math.max(radius, Math.min(box.clientWidth - radius, x));

                spawnFoodAt(x, 30, currentFoodIndex, true);

                canDrop = false;
                guideLine.classList.add('hidden');

                setTimeout(() => {
                    rollNextFoods();
                    canDrop = true;
                }, 500);
            };

            box.addEventListener('mousemove', handleMove);
            box.addEventListener('mouseleave', () => guideLine.classList.add('hidden'));
            box.addEventListener('click', handleDrop);

            box.addEventListener('touchmove', handleMove, { passive: true });
            box.addEventListener('touchend', handleDrop);
        }

        function renderCustomFoodInputs(seasonKey) {
            const container = document.getElementById('customFoodList');
            container.innerHTML = '';

            const list = seasonDatasets[seasonKey];
            list.forEach((item, idx) => {
                const div = document.createElement('div');
                div.className = "food-input-row flex items-center space-x-2 bg-gray-50 p-2 rounded-xl border border-gray-100";
                div.innerHTML = `
                    <div class="w-6 h-6 rounded-full flex items-center justify-center font-bold text-[10px] text-white shadow-sm flex-shrink-0" style="background-color: ${item.color}">
                        ${idx + 1}
                    </div>
                    <div class="w-16 flex-shrink-0">
                        <input type="text" class="food-emoji-input w-full bg-white border border-gray-200 rounded-lg px-2 py-1 text-center text-sm font-bold focus:outline-none focus:border-emerald-500" value="${item.emoji || ''}" placeholder="絵文字">
                    </div>
                    <div class="flex-1">
                        <input type="text" class="food-name-input w-full bg-white border border-gray-200 rounded-lg px-2 py-1 text-xs font-bold text-gray-700 focus:outline-none focus:border-emerald-500" value="${item.name}" placeholder="Lv.${idx + 1}の名前">
                    </div>
                `;
                container.appendChild(div);
            });
        }
    </script>
</body>
</html>
